<div class="card shadow-sm">
  <div class="card-header bg-success-subtle fw-semibold">Registrar dueño</div>
  <div class="card-body">
    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <div class="mb-2">
        <label class="form-label" for="nombres">Nombres</label>
        <input
          id="nombres"
          class="form-control"
          formControlName="nombres"
          [class.is-invalid]="campoInvalido('nombres')"
        />
        <div class="invalid-feedback">Escribe al menos 2 letras.</div>
      </div>

      <div class="mb-2">
        <label class="form-label" for="apellidos">Apellidos</label>
        <input
          id="apellidos"
          class="form-control"
          formControlName="apellidos"
          [class.is-invalid]="campoInvalido('apellidos')"
        />
        <div class="invalid-feedback">Escribe al menos 2 letras.</div>
      </div>

      <div class="row">
        <div class="col-sm-6 mb-2">
          <label class="form-label" for="dni">DNI</label>
          <input
            id="dni"
            class="form-control"
            formControlName="dni"
            maxlength="8"
            inputmode="numeric"
            [class.is-invalid]="campoInvalido('dni')"
          />
          <div class="invalid-feedback">Debe tener 8 dígitos.</div>
        </div>
        <div class="col-sm-6 mb-2">
          <label class="form-label" for="telefono">Celular</label>
          <input
            id="telefono"
            class="form-control"
            formControlName="telefono"
            maxlength="9"
            inputmode="numeric"
            [class.is-invalid]="campoInvalido('telefono')"
          />
          <div class="invalid-feedback">9 dígitos, empieza con 9.</div>
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label" for="email">Correo</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="campoInvalido('email')"
        />
        <div class="invalid-feedback">Correo no válido.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="direccion">Dirección</label>
        <input
          id="direccion"
          class="form-control"
          formControlName="direccion"
          [class.is-invalid]="campoInvalido('direccion')"
        />
        <div class="invalid-feedback">La dirección es obligatoria.</div>
      </div>

      <button type="submit" class="btn btn-success w-100">Registrar</button>
    </form>
  </div>
</div>
